    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2b95b3 0%, #96d3d6 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 20px;
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .name {
            color: white;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s;
            position: relative;
        }

        .social-icon:hover {
            transform: translateY(-2px);
        }

        .social-icon img {
            width: 20px;
            height: 20px;
        }

        .tooltip {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .social-icon:hover .tooltip {
            opacity: 1;
        }

        .link-section {
            margin-bottom: 20px;
        }

        .section-title {
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding-left: 4px;
        }

        .link-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s;
        }

        .link-card:hover {
            transform: translateY(-2px);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .link-text {
            flex: 1;
            font-size: 14px;
        }

        .arrow {
            width: 20px;
            height: 20px;
            opacity: 0.3;
        }

        .qr-container {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .qr-code {
            width: 100px;
            height: 100px;
        }

        .qr-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .qr-container {
                display: none;
            }
            
            .container {
                padding-top: 10px;
            }

            .link-card {
                margin-bottom: 8px;
            }
        }
    </style>
</head>
